{% extends "factures/base.html" %}
{% block title %}Formulaire Facture{% endblock %}
{% block content %}
<h2>{{ form.instance.pk|yesno:"Modifier une facture,Nouvelle facture" }}</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-green">Enregistrer</button>
    <a href="{% url 'liste_factures' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
