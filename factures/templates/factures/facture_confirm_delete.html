{% extends "factures/base.html" %}
{% block title %}Supprimer Facture{% endblock %}
{% block content %}
<h2>Supprimer la facture</h2>
<p>Es-tu sûr de vouloir supprimer la facture <strong>{{ facture.numero }}</strong> pour {{ facture.client }} ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
    <a href="{% url 'liste_factures' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
